<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>상세 추적 · 시간·일 단위</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --panel2: #1f232c; --line: #2a2f3a;
    --text: #e7eaf0; --muted: #8b93a3; --accent: #ff4d6d; --up: #35d07f; --down: #ff6b6b;
    --strm: #3987e5; --like: #ff8fab; --cmt: #f5c451;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard","Malgun Gothic","Segoe UI",sans-serif; padding: 28px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  #sitetabs { display: flex; gap: 8px; margin: -8px 0 18px; flex-wrap: wrap; }
  #sitetabs a { color: var(--muted); text-decoration: none; font-size: 13.5px; font-weight: 700;
    padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); }
  #sitetabs a:hover { color: var(--text); }
  #sitetabs a.on { color: var(--text); background: var(--panel2); border-color: #3a4150; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  /* 곡 카드 */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; margin-bottom: 20px; }
  .cardhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 16px; }
  .cardhead .num { font-size: 13px; color: var(--muted); font-weight: 700; }
  .cardhead .name { font-size: 17px; font-weight: 800; }
  .cardhead .name a { color: var(--text); text-decoration: none; }
  .cardhead .name a:hover { color: var(--accent); }
  .cardhead .artist { font-size: 12.5px; color: var(--muted); font-weight: 400; }
  /* 현재 숫자 타일 */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat .lbl { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .stat .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .stat .val { font-size: 23px; font-weight: 800; margin-top: 5px; letter-spacing: -0.3px; }
  .stat .chg { font-size: 12.5px; font-weight: 700; margin-left: 7px; }
  .chg.pos { color: var(--up); } .chg.neg { color: var(--down); } .chg.flat { color: var(--muted); }
  /* 시간단위 그래프 */
  .sectlbl { font-size: 12.5px; color: var(--muted); font-weight: 700; margin: 4px 0 8px; }
  .charts { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 18px; }
  .facet { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .facet .ft { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; }
  .facet .fbig { font-size: 18px; font-weight: 800; margin: 4px 0 6px; }
  .facet .fbig .s2 { font-size: 11.5px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .fchart { position: relative; height: 200px; }
  .sectrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .modes { display: inline-flex; gap: 6px; }
  .modes button { font-size: 11.5px; font-weight: 700; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-family: inherit; }
  .modes button:hover { color: var(--text); }
  .modes button.on { color: var(--text); background: var(--panel2); border-color: #3a4150; }
  @media (max-width: 720px) { .stats { grid-template-columns: 1fr; } .fchart { height: 170px; } }
  /* 일자별 표 */
  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; white-space: nowrap; }
  th, td { text-align: right; padding: 9px 14px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  th.day, td.day { text-align: left; }
  thead th { color: var(--muted); font-weight: 600; font-size: 11.5px; background: var(--panel2); position: sticky; top: 0; }
  tbody tr.today td { background: rgba(53,208,127,0.06); }
  td.day { font-weight: 700; }
  td .sub2 { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .zero { color: var(--muted); }
  .pos { color: var(--up); } .neg { color: var(--down); }
  .note { color: var(--muted); font-size: 12px; margin-top: 14px; line-height: 1.6; }
  .empty { color: var(--muted); text-align: center; padding: 30px; }
  @media (max-width: 640px) { body { padding: 14px; } .card { padding: 16px; } }
</style>
</head>
<body>
  <!--__NAV__-->
  <h1>🔎 상세 추적</h1>
  <div class="sub" id="updated"></div>
  <div id="cards"></div>
  <div class="note">곡마다 <b>현재 숫자 → 시간단위 그래프(오늘 vs 어제) → 일자별 표</b> 순서로 한 장에 모았습니다. 시간 그래프의 점 = 직전 1시간 증가량(정각 환산). 표의 "증가" = 그날 하루 늘어난 양. 유튜브가 과거 좋아요·댓글 수는 안 줘서, 우리가 매시간 수집한 값으로 복원한 기록입니다(댓글은 수집 시작 이후부터).</div>

<script>
const DB = /*__DATA__*/ null;
const fmt = (n) => n == null ? "–" : n.toLocaleString("ko-KR");
const sgn = (n) => n == null ? "–" : (n > 0 ? "+" : "") + n.toLocaleString("ko-KR");

const snaps = (DB.snapshots || []).slice().sort((a, b) => a.date < b.date ? -1 : 1);
const byDate = Object.fromEntries(snaps.map((s) => [s.date, s]));
const today = snaps.length ? snaps[snaps.length - 1].date : null;
const nextDay = (d) => { const t = new Date(d + "T00:00:00").getTime() + 86400000;
  const x = new Date(t); const p = (n) => String(n).padStart(2, "0");
  return x.getFullYear() + "-" + p(x.getMonth()+1) + "-" + p(x.getDate()); };

document.getElementById("updated").innerHTML = "업데이트: " + (DB.current?.time || "-");

// 그날 하루 스밍(조회수 증가) — 00시 스냅샷 기준
function strmOf(id, d) {
  const a = byDate[d]?.stats?.[id]?.views;
  if (a == null) return null;
  const b = d === today ? DB.current?.stats?.[id]?.views : byDate[nextDay(d)]?.stats?.[id]?.views;
  return b == null ? null : b - a;
}
// 좋아요·댓글은 시간별 수집(hourly)에만 있음 → 그날 "마지막 수집값"을 누적으로
function lastOfDay(H, id) {
  const map = {};
  for (const d of Object.keys(H || {})) {
    let last = null;
    for (const hh of Object.keys(H[d]).sort()) { const val = H[d][hh]?.[id]; if (val != null) last = val; }
    if (last != null) map[d] = last;
  }
  return map;
}
const prevPresent = (map, d) => { const ks = Object.keys(map).filter(k => k < d).sort(); return ks.length ? map[ks[ks.length-1]] : null; };

// 정각 환산 샘플러 (시간 그래프용)
function mkSampler(H, M){
  const cache = {};
  const samples = (id) => {
    if(cache[id]) return cache[id];
    const out = [];
    for(const d of Object.keys(H || {}).sort())
      for(const hh of Object.keys(H[d]).sort()){
        const val = H[d][hh]?.[id]; if(val == null) continue;
        out.push({ t: new Date(d + "T" + hh + ":00:00").getTime()/60000 + (M?.[d]?.[hh] ?? 0), v: val });
      }
    return cache[id] = out;
  };
  const at = (id, dateStr, hour) => {
    const target = new Date(dateStr + "T00:00:00").getTime()/60000 + hour*60;
    let lo = null, hi = null;
    for(const p of samples(id)){ if(p.t <= target) lo = p; else { hi = p; break; } }
    if(lo && lo.t === target) return lo.v;
    if(lo && hi && hi.t - lo.t <= 150) return Math.round(lo.v + (hi.v - lo.v) * (target - lo.t) / (hi.t - lo.t));
    return null;
  };
  return { samples, at };
}
const SV = mkSampler(DB.hourlyViews, DB.hourlyViewsMin);
const SL = mkSampler(DB.hourlyLikes, DB.hourlyLikesMin);

const tracked = Object.keys(DB.videos || {}).filter((id) => DB.videos[id].likesTrack)
  .sort((a, b) => (DB.videos[a].order ?? 99) - (DB.videos[b].order ?? 99));

const cards = document.getElementById("cards");
if (!tracked.length) { cards.innerHTML = '<div class="card"><div class="empty">상세 추적으로 지정된 곡이 없습니다.</div></div>'; }

const chgHtml = (n) => n == null ? '' : '<span class="chg ' + (n>0?'pos':(n<0?'neg':'flat')) + '">' + (n===0?'±0':sgn(n)) + '</span>';
const deltaCell = (n) => n == null ? '<span class="zero">–</span>' : (n>0?'<span class="pos">'+sgn(n)+'</span>':(n<0?'<span class="neg">'+sgn(n)+'</span>':'<span class="zero">0</span>'));

const labels = Array.from({length:24}, (_,h) => h + "시");
const chartJobs = [];

for (let i = 0; i < tracked.length; i++) {
  const id = tracked[i];
  const v = DB.videos[id] || {};
  const likeMap = lastOfDay(DB.hourlyLikes, id);
  const cmtMap = lastOfDay(DB.hourlyComments, id);

  // 현재 숫자 + 오늘 증가
  const vTot = DB.current?.stats?.[id]?.views ?? null;
  const vChg = strmOf(id, today);
  const lTot = likeMap[today] ?? (SL.samples(id).slice(-1)[0]?.v ?? null);
  const lChg = (likeMap[today] != null) ? (likeMap[today] - (prevPresent(likeMap, today) ?? likeMap[today])) : null;
  const cTot = cmtMap[today] ?? null;
  const cChg = (cmtMap[today] != null) ? (cmtMap[today] - (prevPresent(cmtMap, today) ?? cmtMap[today])) : null;

  const stat = (dot, lbl, val, chg) =>
    '<div class="stat"><div class="lbl"><span class="dot" style="background:'+dot+'"></span>'+lbl+'</div>' +
    '<div class="val">'+fmt(val)+chgHtml(chg)+'</div></div>';

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="cardhead"><span class="num">#'+(i+1)+'</span>' +
      '<span class="name"><a href="https://youtu.be/'+id+'" target="_blank">'+(v.title||id)+'</a></span>' +
      (v.artist ? '<span class="artist">'+v.artist+'</span>' : '') + '</div>' +
    '<div class="stats">' +
      stat('var(--strm)','스트리밍(조회수)', vTot, vChg) +
      stat('var(--like)','좋아요', lTot, lChg) +
      stat('var(--cmt)','댓글', cTot, cChg) +
    '</div>' +
    '<div class="sectlbl sectrow"><span>⏱️ 시간단위 — 직전 1시간 증가량</span>' +
      '<span class="modes" id="modes-'+id+'">' +
        '<button class="on" onclick="setMode(\''+id+'\',\'full\',this)">전체 시간대 흐름</button>' +
        '<button onclick="setMode(\''+id+'\',\'cmp\',this)">오늘 vs 어제</button>' +
      '</span></div>' +
    '<div class="charts" id="charts-'+id+'"></div>' +
    '<div class="sectlbl">📅 일자별 추이</div>' +
    '<div id="table-'+id+'"></div>';
  cards.appendChild(card);

  // ── 시간단위 그래프 (스트리밍 / 좋아요) ──
  const cwrap = card.querySelector('#charts-'+id);
  const METRICS = [
    { label:"스트리밍", key:"views", color:"var(--strm)", raw:"#3987e5", s:SV, H:DB.hourlyViews },
    { label:"좋아요",   key:"likes", color:"var(--like)", raw:"#ff8fab", s:SL, H:DB.hourlyLikes },
  ];
  for (const m of METRICS) {
    const daysH = Object.keys(m.H || {}).sort();
    const facet = document.createElement("div");
    facet.className = "facet";
    if (!daysH.length) {
      facet.innerHTML = '<div class="ft"><span class="dot" style="width:9px;height:9px;border-radius:3px;background:'+m.color+'"></span>'+m.label+'</div><div class="empty" style="padding:20px;font-size:12px">다음 수집부터 그래프가 나타나요</div>';
      cwrap.appendChild(facet);
      continue;
    }
    const dToday = daysH[daysH.length-1];
    const dPrev = daysH.length>1 ? daysH[daysH.length-2] : null;
    const dYday = dPrev && (new Date(dToday)-new Date(dPrev)===86400000) ? dPrev : null;
    const seriesOf = (d) => !d ? labels.map(()=>null) : labels.map((_, h) => {
      const a = m.s.at(id,d,h-1), b = m.s.at(id,d,h);
      if (a==null||b==null) return null;
      return m.key==="views" ? Math.max(0,b-a) : b-a;
    });
    const tS = seriesOf(dToday), yS = seriesOf(dYday);
    const all = m.s.samples(id);
    const total = DB.current?.stats?.[id]?.[m.key] ?? (all.length?all[all.length-1].v:null);
    const todayFirst = all.find(p => p.t >= new Date(dToday+"T00:00:00").getTime()/60000);
    const base0 = m.s.at(id,dToday,0) ?? todayFirst?.v;
    const gain = (total!=null && base0!=null) ? total-base0 : null;
    facet.innerHTML =
      '<div class="ft"><span class="dot" style="width:9px;height:9px;border-radius:3px;background:'+m.color+'"></span>'+m.label+'</div>' +
      '<div class="fbig">'+(gain!=null?"+"+gain.toLocaleString("ko-KR"):"—")+'<span class="s2">오늘'+(total!=null?" · 총 "+total.toLocaleString("ko-KR"):"")+'</span></div>' +
      '<div class="fchart"><canvas></canvas></div>';
    cwrap.appendChild(facet);
    // 전체 시간대 흐름: 수집한 모든 날짜×매시간의 "직전 1시간 증가량"을 시간순으로 이어붙임
    const fL = [], fD = [];
    for (const d of daysH) {
      const md = d.slice(5).replace("-","/");
      for (let h = 0; h < 24; h++) {
        const a = m.s.at(id,d,h-1), b = m.s.at(id,d,h);
        fL.push(md + " " + h + "시");
        fD.push((a==null||b==null) ? null : (m.key==="views" ? Math.max(0,b-a) : b-a));
      }
    }
    let s0 = 0, e0 = fD.length - 1;
    while (s0 <= e0 && fD[s0] == null) s0++;
    while (e0 >= s0 && fD[e0] == null) e0--;
    chartJobs.push({ canvas: facet.querySelector("canvas"), key: id, raw: m.raw,
      full: { labels: fL.slice(s0, e0+1), data: fD.slice(s0, e0+1) },
      cmp: { today: tS, yday: yS } });
  }

  // ── 일자별 표 ──
  const dset = new Set([...snaps.map(s=>s.date).filter(d => byDate[d]?.stats?.[id]?.views != null), ...Object.keys(likeMap)]);
  const dl = [...dset].sort();
  const twrap = card.querySelector('#table-'+id);
  if (!dl.length) { twrap.innerHTML = '<div class="empty">아직 일자별 데이터가 없습니다.</div>'; }
  else {
    const rows = dl.slice().reverse().map((d) => {
      const strm = strmOf(id,d);
      const lc = likeMap[d] ?? null, lp = prevPresent(likeMap,d);
      const ld = (lc!=null && lp!=null) ? lc-lp : null;
      const cc = cmtMap[d] ?? null, cp = prevPresent(cmtMap,d);
      const cd = (cc!=null && cp!=null) ? cc-cp : null;
      return '<tr class="'+(d===today?'today':'')+'">' +
        '<td class="day">'+d.slice(5).replace("-","/")+(d===today?' <span class="sub2">오늘</span>':'')+'</td>' +
        '<td class="'+(strm==null?'zero':'')+'">'+fmt(strm)+'</td>' +
        '<td>'+fmt(lc)+'<span class="sub2">'+ (ld!=null?(ld>0?'+':'')+ld.toLocaleString("ko-KR"):'') +'</span></td>' +
        '<td>'+fmt(cc)+'<span class="sub2">'+ (cd!=null?(cd>0?'+':'')+cd.toLocaleString("ko-KR"):'') +'</span></td>' +
        '</tr>';
    }).join("");
    twrap.innerHTML = '<div class="wrap"><table><thead><tr>' +
      '<th class="day">날짜</th><th>스밍(그날)</th><th>좋아요 <span style="font-weight:400">(누적·증가)</span></th><th>댓글 <span style="font-weight:400">(누적·증가)</span></th>' +
      '</tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
}

// 차트 렌더 + 모드 토글 (기본: 전체 시간대 흐름)
const gray = "#8b93a3";
const CHARTS = {};
function optsFor(mode) {
  return { responsive:true, maintainAspectRatio:false,
    interaction:{ mode:"index", intersect:false },
    plugins:{ legend:{ display:false },
      tooltip:{ callbacks:{ label:(c)=> c.dataset.label+": "+(c.parsed.y==null?"–":(c.parsed.y>=0?"+":"")+c.parsed.y.toLocaleString("ko-KR")) } } },
    scales:{
      x:{ ticks:{ color:gray, maxTicksLimit: mode==="full"?9:7, autoSkip:true, maxRotation:0, font:{size:10} }, grid:{ display:false } },
      y:{ beginAtZero:true, ticks:{ color:gray, maxTicksLimit:4, font:{size:10} }, grid:{ color:"#232833" } }
    } };
}
function dsFull(j) {
  return [{ label:"시간당 증가", data:j.full.data, borderColor:j.raw, backgroundColor:j.raw+"2e",
    fill:true, tension:0.2, spanGaps:true, borderWidth:2, pointRadius:0, pointHitRadius:6 }];
}
function dsCmp(j) {
  const pts = j.cmp.today.filter(x => x!=null).length;
  return [
    { label:"오늘", data:j.cmp.today, borderColor:j.raw, backgroundColor:j.raw+"2e", fill:true, tension:0.25, spanGaps:true, borderWidth:2, pointRadius: pts<2?3:0, pointHitRadius:8 },
    { label:"어제", data:j.cmp.yday, borderColor:gray, borderDash:[5,4], fill:false, tension:0.25, spanGaps:true, borderWidth:1.5, pointRadius:0, pointHitRadius:8 },
  ];
}
if (typeof Chart !== "undefined") {
  for (const j of chartJobs) {
    const ch = new Chart(j.canvas, { type:"line", data:{ labels:j.full.labels, datasets:dsFull(j) }, options:optsFor("full") });
    (CHARTS[j.key] = CHARTS[j.key] || []).push({ chart: ch, job: j });
  }
}
function setMode(key, mode, btn) {
  if (btn && btn.parentElement) btn.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
  for (const ref of (CHARTS[key] || [])) {
    const j = ref.job, ch = ref.chart;
    ch.data.labels = mode==="full" ? j.full.labels : labels;
    ch.data.datasets = mode==="full" ? dsFull(j) : dsCmp(j);
    ch.options = optsFor(mode);
    ch.update();
  }
}
</script>
</body>
</html>
